[project]
name = "rct-visualization"
version = "0.1.0"
description = "Marimo notebooks that read landmark randomized controlled trials through the CONSORT 2025 checklist"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.17.8",
    "altair>=6.1.0",
    "polars>=1.40.0",
    "pypdf>=4.0",
]

[tool.marimo.runtime]
auto_instantiate = false

[dependency-groups]
dev = [
    "ruff>=0.6",
]
